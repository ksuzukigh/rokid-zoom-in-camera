name: Android checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-build-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run tests, lint, and debug build
        run: |
          chmod +x gradlew
          ./gradlew test lint assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  windows-installer-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows installer
        shell: powershell
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("./install-rokid-zoom-in-camera.ps1")
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
            throw "Windows PowerShell 5.1 requires a UTF-8 BOM for this Japanese installer."
          }
          $source = Get-Content -Raw -Encoding UTF8 ./install-rokid-zoom-in-camera.ps1
          $null = [scriptblock]::Create($source)
